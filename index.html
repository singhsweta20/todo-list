<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow Pro — Production Grade Task Manager</title>
  
  <!-- Modern Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- External CSS File Link -->
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

  <div class="container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-check-double"></i></div>
        <h1>TaskFlow Pro</h1>
      </div>
      <button class="theme-toggle" id="themeBtn" title="Toggle Theme">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>

    <!-- Progress Card -->
    <div class="progress-card">
      <div class="progress-header">
        <span>Completion Progress</span>
        <span id="progressText">0% Completed</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- New Task Form -->
    <div class="task-form">
      <div class="input-group">
        <input type="text" id="taskInput" placeholder="Add a title for your task..." autocomplete="off" />
        <button class="add-btn" id="addBtn">
          <i class="fa-solid fa-plus"></i> Add
        </button>
      </div>

      <div class="options-row">
        <select id="categoryInput" class="custom-select">
          <option value="Work">💼 Work</option>
          <option value="Personal">👤 Personal</option>
          <option value="Urgent">🔥 Urgent</option>
        </select>

        <select id="priorityInput" class="custom-select">
          <option value="low">🟢 Low Priority</option>
          <option value="medium" selected>🟡 Medium Priority</option>
          <option value="high">🔴 High Priority</option>
        </select>
      </div>
    </div>

    <!-- Toolbar: Search & Filter Tabs -->
    <div class="toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search tasks..." />
      </div>

      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="active">Active</button>
        <button class="filter-tab" data-filter="completed">Done</button>
      </div>
    </div>

    <!-- Dynamic Tasks List -->
    <ul class="task-list" id="taskList"></ul>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
      <i class="fa-solid fa-clipboard-list"></i>
      <p>No tasks found. Create a new task to get started!</p>
    </div>
  </div>

  <!-- External JS File Link -->
  <script src="script.js"></script>
</body>
</html>
