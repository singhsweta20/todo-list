<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro | Modern Task Management</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Glow Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="app-container">
        
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1>TaskFlow <span>Pro</span></h1>
                    <p>Elevate your productivity</p>
                </div>
            </div>
            
            <div class="header-actions">
                <button id="themeToggleBtn" class="icon-btn" title="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Progress Stats Card -->
        <div class="glass-card stats-card">
            <div class="stats-header">
                <div>
                    <h3>Task Progress</h3>
                    <p id="progressText">0 of 0 tasks completed</p>
                </div>
                <div class="percent-badge" id="percentBadge">0%</div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>

        <!-- Input Section -->
        <div class="glass-card input-card">
            <form id="todoForm">
                <div class="input-group">
                    <i class="fa-solid fa-plus input-icon"></i>
                    <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off" required>
                    <button type="submit" class="btn btn-primary">
                        <span>Add Task</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>

                <div class="meta-inputs">
                    <div class="select-wrapper">
                        <i class="fa-solid fa-folder-open"></i>
                        <select id="categorySelect">
                            <option value="Work">Work</option>
                            <option value="Personal">Personal</option>
                            <option value="Study">Study</option>
                            <option value="Urgent">Urgent</option>
                        </select>
                    </div>

                    <div class="select-wrapper">
                        <i class="fa-solid fa-flag"></i>
                        <select id="prioritySelect">
                            <option value="Low">Low Priority</option>
                            <option value="Medium" selected>Medium Priority</option>
                            <option value="High">High Priority</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>

        <!-- Controls (Search & Filters) -->
        <div class="controls-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search tasks...">
            </div>

            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </div>

        <!-- Tasks List Container -->
        <div class="tasks-container" id="tasksContainer">
            <!-- Dynamic tasks render here -->
        </div>

    </div>

    <!-- Edit Task Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="glass-card modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-pen-to-square"></i> Edit Task</h3>
                <button class="close-btn" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <input type="text" id="editTaskInput" class="modal-input">
                <div class="meta-inputs mt-3">
                    <div class="select-wrapper">
                        <select id="editCategorySelect">
                            <option value="Work">Work</option>
                            <option value="Personal">Personal</option>
                            <option value="Study">Study</option>
                            <option value="Urgent">Urgent</option>
                        </select>
                    </div>
                    <div class="select-wrapper">
                        <select id="editPrioritySelect">
                            <option value="Low">Low Priority</option>
                            <option value="Medium">Medium Priority</option>
                            <option value="High">High Priority</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelEditBtn">Cancel</button>
                <button class="btn btn-primary" id="saveEditBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
